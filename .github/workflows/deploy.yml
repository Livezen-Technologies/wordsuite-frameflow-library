# Deploys the Library API, admin web and FrameFlow feed to Cloudflare
# (a Worker in front of one Container) at
# https://library.frameflow.worksuitecloud.com. Run it from Actions → Deploy.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, Workers Routes:Edit, Containers:Edit,
#                          Zone DNS:Edit on worksuitecloud.com
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL                     PostgreSQL (e.g. Neon, Supabase, RDS)
#   LIBRARY_SIGNING_KEY              PEM Ed25519 private key; the same key as FrameFlow's
#                                    ASSET_SIGNING_KEY so the app's built-in key verifies it
#   LIBRARY_S3_ENDPOINT              https://<account id>.r2.cloudflarestorage.com
#   LIBRARY_S3_BUCKET, LIBRARY_S3_ACCESS_KEY_ID, LIBRARY_S3_SECRET_ACCESS_KEY   (an R2 API token)
#   LIBRARY_OIDC_ISSUER              e.g. https://accounts.worksuitecloud.com
#   LIBRARY_ADMIN_TOKENS             optional: server-to-server tokens, "token:role:id,…"
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIBRARY_SIGNING_KEY: ${{ secrets.LIBRARY_SIGNING_KEY }}
          LIBRARY_S3_ENDPOINT: ${{ secrets.LIBRARY_S3_ENDPOINT }}
          LIBRARY_S3_BUCKET: ${{ secrets.LIBRARY_S3_BUCKET }}
          LIBRARY_S3_ACCESS_KEY_ID: ${{ secrets.LIBRARY_S3_ACCESS_KEY_ID }}
          LIBRARY_S3_SECRET_ACCESS_KEY: ${{ secrets.LIBRARY_S3_SECRET_ACCESS_KEY }}
          LIBRARY_OIDC_ISSUER: ${{ secrets.LIBRARY_OIDC_ISSUER }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL LIBRARY_SIGNING_KEY LIBRARY_S3_ENDPOINT LIBRARY_S3_BUCKET LIBRARY_S3_ACCESS_KEY_ID LIBRARY_S3_SECRET_ACCESS_KEY LIBRARY_OIDC_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - run: npm ci
      - run: npm test

      - name: Install deploy tools
        working-directory: deploy/cloudflare
        run: npm ci

      - name: Deploy Worker and Container
        working-directory: deploy/cloudflare
        run: npx wrangler deploy

      - name: Set runtime secrets
        working-directory: deploy/cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIBRARY_SIGNING_KEY: ${{ secrets.LIBRARY_SIGNING_KEY }}
          LIBRARY_S3_ENDPOINT: ${{ secrets.LIBRARY_S3_ENDPOINT }}
          LIBRARY_S3_BUCKET: ${{ secrets.LIBRARY_S3_BUCKET }}
          LIBRARY_S3_ACCESS_KEY_ID: ${{ secrets.LIBRARY_S3_ACCESS_KEY_ID }}
          LIBRARY_S3_SECRET_ACCESS_KEY: ${{ secrets.LIBRARY_S3_SECRET_ACCESS_KEY }}
          LIBRARY_OIDC_ISSUER: ${{ secrets.LIBRARY_OIDC_ISSUER }}
          LIBRARY_ADMIN_TOKENS: ${{ secrets.LIBRARY_ADMIN_TOKENS }}
        run: |
          node -e 'const k=["DATABASE_URL","LIBRARY_SIGNING_KEY","LIBRARY_S3_ENDPOINT","LIBRARY_S3_BUCKET","LIBRARY_S3_ACCESS_KEY_ID","LIBRARY_S3_SECRET_ACCESS_KEY","LIBRARY_OIDC_ISSUER","LIBRARY_ADMIN_TOKENS"];process.stdout.write(JSON.stringify(Object.fromEntries(k.filter(n=>process.env[n]).map(n=>[n,process.env[n]]))))' > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      # The container reads its environment when it starts: deploy again so it starts with the secrets.
      - name: Restart with secrets
        working-directory: deploy/cloudflare
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://library.frameflow.worksuitecloud.com/healthz) && [ "$code" = 200 ] && echo "Live: HTTP $code" && exit 0
            echo "Waiting for the container (HTTP $code)…"; sleep 20
          done
          echo "::error::https://library.frameflow.worksuitecloud.com/healthz didn't answer 200"; exit 1
