server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA owns every other path (/, /library/*, /pricing, /login, /admin/*).
  location / {
    try_files $uri /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Same-origin API and feed: set LIBRARY_API_UPSTREAM, or build with VITE_API_BASE pointing elsewhere.
  location /api/ {
    proxy_pass ${LIBRARY_API_UPSTREAM};
    client_max_body_size 2g;
    proxy_request_buffering off;
  }
  location /feed/ {
    proxy_pass ${LIBRARY_API_UPSTREAM};
  }
}
