name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Livezen-Technologies/worksuite-frameflow
          path: worksuite-frameflow
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Worker tools (FFmpeg, fonts, Chromium)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core
          npm ci --prefix apps/workers
          npx --prefix apps/workers playwright install --with-deps chromium
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, sodium, pdo_pgsql, pgsql, sqlite3, zip, curl
          tools: composer:v2
      - name: Backend (CodeIgniter) unit tests
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit --no-coverage
      - name: Acceptance suite against the backend (SQLite, then PostgreSQL)
        run: |
          npm test
          LIBRARY_PHP_DATABASE_URL=postgres://postgres:postgres@localhost:5432/library_test npm test
        env:
          FRAMEFLOW_DIR: ${{ github.workspace }}/worksuite-frameflow
      - name: Docker images build
        run: |
          docker build -t frameflow-library-api backend
          docker build -f apps/workers/Dockerfile -t frameflow-library-worker .
