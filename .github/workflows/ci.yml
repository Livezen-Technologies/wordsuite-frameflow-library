name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Livezen-Technologies/worksuite-frameflow
          path: worksuite-frameflow
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          FRAMEFLOW_DIR: ${{ github.workspace }}/worksuite-frameflow
          LIBRARY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/library_test
      - name: Docker image builds
        run: docker build -t frameflow-library .
