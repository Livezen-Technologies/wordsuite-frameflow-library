<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FrameFlow Download Center</title>
	<script src="https://cdn.tailwindcss.com/3.4.17"></script>
	<style>
		body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
		.thumb { background: linear-gradient(135deg, var(--a, #6366f1), #1f2937); }
		.bar { height: 6px; border-radius: 9999px; background: #e5e7eb; overflow: hidden; }
		.bar > i { display: block; height: 100%; background: #6366f1; }
		button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
	</style>
</head>
<body class="bg-gray-50 text-gray-900">
	<div id="signin" class="hidden min-h-screen grid place-items-center p-4">
		<form class="w-full max-w-sm rounded-xl bg-white p-6 shadow ring-1 ring-gray-200" id="signinForm">
			<div class="flex items-center gap-2"><span class="grid size-9 place-items-center rounded-md bg-indigo-600 font-bold text-white">F</span><div><p class="font-semibold">FrameFlow</p><p class="text-xs text-gray-500">Download Center</p></div></div>
			<label class="mt-6 block text-sm font-medium" for="token">Access token</label>
			<input id="token" type="password" autocomplete="current-password" class="mt-1 w-full rounded-md px-3 py-2 ring-1 ring-gray-300" required>
			<p class="mt-2 text-xs text-gray-500">Issued by WorkSuite OneAuth. Local dev: <code>dev-admin</code>.</p>
			<p id="signinError" class="mt-2 text-sm text-red-600"></p>
			<button class="mt-4 w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white">Sign in</button>
		</form>
	</div>

	<div id="app" class="hidden lg:flex min-h-screen">
		<aside class="lg:w-60 shrink-0 bg-gray-900 text-gray-300 p-4">
			<div class="flex items-center gap-2 px-2 pb-5"><span class="grid size-8 place-items-center rounded-md bg-indigo-500 font-bold text-white">F</span><div><p class="text-sm font-semibold text-white">FrameFlow</p><p class="text-[10px] text-gray-400">Download Center</p></div></div>
			<nav id="nav" class="flex flex-wrap lg:block gap-1 text-sm"></nav>
			<div class="mt-6 px-2 text-xs text-gray-500"><span id="who"></span> · <button id="signout" class="underline">Sign out</button></div>
		</aside>
		<main id="view" class="flex-1 min-w-0 p-4 lg:p-8"></main>
	</div>
	<div id="toast" class="fixed bottom-4 right-4 hidden max-w-md rounded-md px-4 py-3 text-sm shadow-lg"></div>
	<script type="module" src="app.js"></script>
</body>
</html>
